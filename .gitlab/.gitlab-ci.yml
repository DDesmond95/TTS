stages:
  - lint
  - test
  - build
  - push

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  IMAGE_API: $DOCKERHUB_USERNAME/omnivoice-studio-api
  IMAGE_UI: $DOCKERHUB_USERNAME/omnivoice-studio-ui

cache:
  paths:
    - .cache/pip

# --- Linting Stage ---
lint:
  stage: lint
  image: python:3.12-slim
  script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"
    - ruff check .
    - ruff format --check .
    - mypy src

# --- Testing Stage ---
test:
  stage: test
  image: python:3.12-slim
  script:
    - python -m pip install --upgrade pip
    - pip install -e ".[dev]"
    - pytest -q

# --- Build Stage (Lite & UI) ---
build_lite:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - export TAG=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}
    - docker build --build-arg PRELOAD_MODELS=false -f docker/Dockerfile.api -t "$IMAGE_API:lite" -t "$IMAGE_API:$TAG" .
    - docker build -f docker/Dockerfile.ui -t "$IMAGE_UI:latest" -t "$IMAGE_UI:$TAG" .
    - docker push "$IMAGE_API:lite"
    - docker push "$IMAGE_API:$TAG"
    - docker push "$IMAGE_UI:latest"
    - docker push "$IMAGE_UI:$TAG"

# --- Build Stage (Full - Only on Tags) ---
build_full:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - export TAG="$CI_COMMIT_TAG-full"
    - docker build --build-arg PRELOAD_MODELS=true -f docker/Dockerfile.api -t "$IMAGE_API:full" -t "$IMAGE_API:$TAG" .
    - docker push "$IMAGE_API:full"
    - docker push "$IMAGE_API:$TAG"
