services:
  # --- OmniVoice API (Local-First) ---
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      args:
        PRELOAD_MODELS: "false"
    image: ${DOCKER_USERNAME}/${IMAGE_API}:${IMAGE_TAG}
    ports:
      - "${API_PORT}:${API_PORT}"
    volumes:
      - ${MODELS_DIR}:/app/models
      - ${VOICES_DIR}:/app/voices
      - ${OUTPUTS_DIR}:/app/outputs
      - ${CONFIGS_DIR}:/app/configs
    environment:
      - DEVICE=${DEVICE}
      - DTYPE=${DTYPE}
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]

  # --- OmniVoice UI ---
  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ui
    image: ${DOCKER_USERNAME}/${IMAGE_UI}:${IMAGE_TAG}
    ports:
      - "${UI_PORT}:${UI_PORT}"
    depends_on:
      - api
    volumes:
      - ${MODELS_DIR}:/app/models
      - ${VOICES_DIR}:/app/voices
      - ${OUTPUTS_DIR}:/app/outputs
    environment:
      - UI_MODE=${UI_MODE}
      - API_URL=${API_URL}
