name: docker-publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      push_full:
        description: "Whether to build and push the full (model-loaded) image"
        required: false
        default: false
        type: boolean

env:
  REGISTRY: docker.io
  USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_API: omnivoice-studio-api
  IMAGE_UI: omnivoice-studio-ui

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Metadata (Latest/Tag)
        id: meta
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      # --- LITE IMAGES ---
      - name: Build & Push API (Lite)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          build-args: PRELOAD_MODELS=false
          tags: |
            ${{ env.USERNAME }}/${{ env.IMAGE_API }}:lite
            ${{ env.USERNAME }}/${{ env.IMAGE_API }}:${{ steps.meta.outputs.tag }}

      - name: Build & Push UI
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ui
          push: true
          tags: |
            ${{ env.USERNAME }}/${{ env.IMAGE_UI }}:latest
            ${{ env.USERNAME }}/${{ env.IMAGE_UI }}:${{ steps.meta.outputs.tag }}

      # --- FULL IMAGES (Only on tags or explicit dispatch) ---
      - name: Build & Push API (Full)
        if: github.ref_type == 'tag' || github.event.inputs.push_full == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          build-args: PRELOAD_MODELS=true
          tags: |
            ${{ env.USERNAME }}/${{ env.IMAGE_API }}:full
            ${{ env.USERNAME }}/${{ env.IMAGE_API }}:${{ steps.meta.outputs.tag }}-full
