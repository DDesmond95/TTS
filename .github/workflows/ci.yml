name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip" # built-in pip caching in setup-python

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint & format)
        run: |
          ruff check .
          ruff format --check .

      - name: Pylint (static analysis)
        run: |
          pylint src --rcfile .pylintrc > pylint_report.txt 2>&1 || true
          pylint src --rcfile .pylintrc --fail-under=7.0

      - name: Upload Pylint Report
        uses: actions/upload-artifact@v4
        with:
          name: pylint-report
          path: pylint_report.txt

      - name: MyPy (type check)
        run: |
          mypy src

      - name: Pytest
        run: |
          pytest -q
